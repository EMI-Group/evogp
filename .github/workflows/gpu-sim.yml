name: GPU tests (simulated H100)

# The hosted runners have no GPU, so the CUDA extension is never exercised in
# CI. This builds it for CUDA 13.0 and runs a small check plus example/basic.py
# on a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim). A
# simulator cannot reproduce hardware-specific behavior or timing, so it
# complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "example/basic.py"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu-sim:
    name: evogp CUDA ops (CUDA 13.0, simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated H100 and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install torch (CUDA 13.0 wheel) and the dependencies
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install torch --index-url https://download.pytorch.org/whl/cu130
          pip install numpy scikit_learn sympy networkx setuptools wheel
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # 9.0+PTX makes torch pass -gencode for compute_90 (PTX), which the
      # simulator runs. setup.py adds -lcudart, and torch's CUDA_HOME here has
      # no libcudart.so in lib64, so LIBRARY_PATH points the linker at the
      # simulator's shared runtime.
      - name: Build the evogp CUDA extension
        env:
          TORCH_CUDA_ARCH_LIST: "9.0+PTX"
        run: |
          cudart=$(find "$RUNNER_TEMP/pantheonsim-build" -name libcudart.so | head -n 1)
          echo "libcudart: $cudart"
          LIBRARY_PATH=$(dirname "$cudart")
          export LIBRARY_PATH
          pip install --no-build-isolation .

      # test/test_bind_success.py only prints, and it currently fails on a
      # roulette_funcs shape error, so this step compares the extension with a
      # CPU reference instead: forward evaluation and SR fitness against NumPy
      # for random + - * trees, plus mutation and crossover structure checks.
      - name: Write the check script
        run: |
          mkdir "$RUNNER_TEMP/run"
          cat > "$RUNNER_TEMP/run/check_ops.py" <<'PYEOF'
          import numpy as np
          import torch
          from evogp.tree import Forest, GenerateDescriptor

          assert torch.cuda.is_available()
          print("device:", torch.cuda.get_device_name(0))
          torch.manual_seed(0)
          torch.cuda.manual_seed(0)

          ADD, SUB, MUL = 1, 2, 3
          VAR, CONST, BFUNC = 0, 1, 3


          def check_structure(value, ntype, size):
              """Preorder layout: every subtree_size must match the node arities."""
              n = int(size[0])
              assert 1 <= n <= len(value), f"bad root size {n}"
              sizes = []
              for i in range(n - 1, -1, -1):
                  t = int(ntype[i]) & 0x7F
                  if t in (VAR, CONST):
                      s = 1
                  else:
                      assert t == BFUNC, f"unexpected node type {t}"
                      right = sizes.pop()
                      left = sizes.pop()
                      s = 1 + left + right
                  assert int(size[i]) == s, f"subtree_size[{i}]={int(size[i])}, expected {s}"
                  sizes.append(s)
              assert sizes == [n]


          def ref_eval(value, ntype, size, x):
              """CPU reference: x is (N, input_len), returns (N,) float32."""
              stack = []
              for i in range(int(size[0]) - 1, -1, -1):
                  t = int(ntype[i]) & 0x7F
                  if t == VAR:
                      stack.append(x[:, int(value[i])])
                  elif t == CONST:
                      stack.append(np.full(x.shape[0], value[i], dtype=np.float32))
                  else:
                      a = stack.pop()
                      b = stack.pop()
                      f = int(value[i])
                      stack.append({ADD: a + b, SUB: a - b, MUL: a * b}[f])
              return np.clip(stack.pop(), -1e9, 1e9)


          def host(forest):
              return (
                  forest.batch_node_value.cpu().numpy(),
                  forest.batch_node_type.cpu().numpy(),
                  forest.batch_subtree_size.cpu().numpy(),
              )


          POP, IN, LEN = 64, 3, 63
          desc = GenerateDescriptor(
              max_tree_len=LEN,
              input_len=IN,
              output_len=1,
              using_funcs=["+", "-", "*"],
              max_layer_cnt=5,
              const_samples=[-1, 0, 1, 2],
          )
          forest = Forest.random_generate(pop_size=POP, descriptor=desc)
          val, typ, siz = host(forest)
          for i in range(POP):
              check_structure(val[i], typ[i], siz[i])
          assert len({int(s[0]) for s in siz}) > 1, "generated trees all have the same size"

          # 1. forward: one input row per tree
          x = torch.randn(POP, IN, device="cuda")
          out = forest.forward(x).cpu().numpy().reshape(POP)
          xn = x.cpu().numpy()
          ref = np.array([ref_eval(val[i], typ[i], siz[i], xn[i : i + 1])[0] for i in range(POP)])
          np.testing.assert_allclose(out, ref, rtol=1e-4, atol=1e-4)
          print("forward matches the CPU reference for", POP, "trees")

          # 2. SR fitness (MSE) over a data set
          N = 32
          data = torch.randn(N, IN, device="cuda")
          labels = torch.randn(N, 1, device="cuda")
          dn, ln = data.cpu().numpy(), labels.cpu().numpy().reshape(N)
          mse = np.array([np.mean((ref_eval(val[i], typ[i], siz[i], dn) - ln) ** 2) for i in range(POP)])
          for mode in ("data parallel", "tree parallel", "auto"):
              fit = forest.SR_fitness(data, labels, use_MSE=True, execute_mode=mode).cpu().numpy()
              np.testing.assert_allclose(np.abs(fit), mse, rtol=1e-3, atol=1e-3, err_msg=mode)
          print("SR_fitness matches the CPU reference in 3 execution modes")

          # 3. mutation: replacing the root gives back the new tree, other positions stay valid
          new = Forest.random_generate(pop_size=POP, descriptor=desc)
          nv, nt, ns = host(new)
          m0 = forest.mutate(torch.zeros(POP, dtype=torch.int32, device="cuda"), new)
          mv, mt, ms = host(m0)
          for i in range(POP):
              n = int(ns[i][0])
              assert ms[i][0] == ns[i][0]
              assert (mt[i][:n] == nt[i][:n]).all() and (mv[i][:n] == nv[i][:n]).all()
          pos = torch.tensor([int(s[0]) // 2 for s in siz], dtype=torch.int32, device="cuda")
          mut = forest.mutate(pos, new)
          for i, (v, t, s) in enumerate(zip(*host(mut))):
              check_structure(v, t, s)
          print("mutate keeps trees valid")

          # 4. crossover: children are valid trees and a root swap copies the right parent
          left = torch.arange(POP, dtype=torch.int32, device="cuda")
          right = torch.flip(left, dims=[0]).contiguous()
          c0 = forest.crossover(left, right, torch.zeros_like(left), torch.zeros_like(left))
          cv, ct, cs = host(c0)
          for i in range(POP):
              j = POP - 1 - i
              n = int(siz[j][0])
              assert cs[i][0] == siz[j][0]
              assert (ct[i][:n] == typ[j][:n]).all() and (cv[i][:n] == val[j][:n]).all()
          lp = torch.zeros(POP, dtype=torch.int32, device="cuda")
          rp = torch.tensor([int(s[0]) // 2 for s in siz], dtype=torch.int32, device="cuda")[right.long()]
          cx = forest.crossover(left, right, lp, rp)
          for v, t, s in zip(*host(cx)):
              check_structure(v, t, s)
          print("crossover keeps trees valid")

          # 5. a hand-built tree: (x0 * x1) + 3
          v = torch.zeros(1, 8, device="cuda")
          t = torch.zeros(1, 8, dtype=torch.int16, device="cuda")
          s = torch.zeros(1, 8, dtype=torch.int16, device="cuda")
          v[0, :5] = torch.tensor([ADD, MUL, 0, 1, 3.0])
          t[0, :5] = torch.tensor([BFUNC, BFUNC, VAR, VAR, CONST], dtype=torch.int16)
          s[0, :5] = torch.tensor([5, 3, 1, 1, 1], dtype=torch.int16)
          hand = Forest(2, 1, v, t, s)
          r = hand.forward(torch.tensor([[2.0, 5.0]], device="cuda"))
          assert abs(float(r) - 13.0) < 1e-5, float(r)
          print("hand-built tree gives 13.0")
          PYEOF

      # Run from outside the checkout so that the installed package is
      # imported, not the source tree. --preload makes the simulator's CUDA
      # libraries win over the ones inside the torch wheel.
      - name: Run the checks on the simulated H100
        run: |
          cd "$RUNNER_TEMP/run"
          vgpu run --preload --gpu nvidia/h100 python check_ops.py
          vgpu run --preload --gpu nvidia/h100 python "$GITHUB_WORKSPACE/example/basic.py" > basic.log
          tail -n 12 basic.log
